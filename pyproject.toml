[project]
name = "mealie-hook"
version = "0.1.0"
description = "Post-import processing for Mealie recipes, triggered by Mealie's recipe_created event and driven by a local LLM"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mealie-hook = "mealie_hook.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mealie_hook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
