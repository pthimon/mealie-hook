[project]
name = "mealie-toolkit"
version = "0.1.0"
description = "Mealie companion: post-import recipe processing with a local LLM, and the Mealie Toolkit page (plan to shopping list, shopping export, review, rules)"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mealie-toolkit = "mealie_toolkit.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mealie_toolkit"]

[tool.setuptools.package-data]
mealie_toolkit = ["editor.md", "ui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
