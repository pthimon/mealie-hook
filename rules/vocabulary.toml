# Guidance and roles for Mealie's organizers. Names must match Mealie exactly;
# a name in Mealie but not here is still offered to the model, with no guidance.
# Edited from the rules page (/rules/); this header is regenerated on save.
#
# Roles:
#   categories  main          main-dish slot: not-on-mains tags are dropped, new_protein is considered
#   tags        protein       listed as a protein tag
#   tags        season        listed as a season tag
#   tags        summer        never kept together with a winter tag
#   tags        winter        added to anything that uses a slow-cooker tool
#   tags        character     listed as a character tag
#   tags        not-on-mains  never kept on a main category
#   tags        provenance    records where a recipe came from; never chosen by the model
#   tools       slow-cooker   added when the recipe says "slow cooker"; implies winter
#   labels      herbs         "sage leaves" folds onto an existing herb food in this aisle

# -------------------- categories

[categories.Dinner]
roles = ["main"]
guidance = "Evening mains: curries, tagines, traybakes, roasted or baked fish, chillis, stews, casseroles, pasta bakes, burrito bowls."

[categories.Lunch]
roles = ["main"]
guidance = "Soups, salads, wraps, bowls, bruschetta, things on toast, light single-serve dishes. Light and portable, not just soup. A crab cake starter serving two is Lunch."

[categories.Breakfast]
guidance = "Porridge, bircher, overnight oats, pancakes, shakshuka, egg dishes."

[categories.Dessert]
guidance = "Eaten with a spoon after a meal: sorbets, jellies, compotes, puddings, mousses, fools, crumbles, cakes, tarts, cheesecake, brownies."

[categories.Snack]
guidance = "Eaten out of hand or with tea: energy balls, cookies, muffins, banana bread, flapjacks, and savoury nibbles (popcorn, roasted chickpeas, hummus). Muffins and banana breads are Snack, not Dessert."

[categories.Side]
guidance = "Dressings, pickles, ferments, crispy toppings and condiments that are assembled into something else rather than eaten alone; also side vegetables."

