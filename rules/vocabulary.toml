guidance = "Salads, chilled soups, cold desserts (sorbets, lollies, fools), barbecue and griddle dishes, traybakes built on summer vegetables (peppers, courgettes, tomatoes, olives), dishes of summer fruit (strawberries, raspberries, peaches). Autumn fruit (apples, blackberries, plums) is not Summer."

