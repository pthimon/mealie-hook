name: mealie-toolkit
services:
  mealie-toolkit:
    image: localhost/mealie-toolkit:latest # built by deploy.sh on marvin
    container_name: mealie-toolkit
    restart: unless-stopped
    mem_limit: 256m
    # Rootless podman: keep-id maps host simon <-> container 1000, so ./data stays
    # simon-owned and readable from the host (snapshots, run records, eval reports).
    userns_mode: keep-id
    user: ${PUID:-1000}:${PGID:-1000}
    env_file: .env # MEALIE_TOKEN lives here, never in git
    environment:
      MEALIE_URL: http://mealie:9000/api
      LLM_URL: http://host.containers.internal:8080/v1
      DATA_DIR: /data
    volumes:
      - ./data:/data:z
      # The live rules (vocabulary + prompts, edited from the Toolkit page) are in ./data/rules.
    # No published port. Mealie reaches the hook as http://mealie-toolkit:8000 over its network;
    # Caddy (on `proxy`) serves only the /ui pages, as <mealie domain>/toolkit/.
    networks:
      - mealie
      - proxy
networks:
  mealie:
    external: true
    name: mealie_default
  proxy:
    external: true
